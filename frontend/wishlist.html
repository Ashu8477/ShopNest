<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ShopNest - Wishlist</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        max-width: 1050px;
        margin: 32px auto;
        padding: 0 20px;
      }
      .head {
        margin-bottom: 20px;
      }
      .head h2 {
        font-size: 25px;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
        margin-top: 5px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
      }
      .image {
        width: 100%;
        height: 175px;
        object-fit: cover;
      }
      .body {
        padding: 15px;
      }
      .name {
        font-weight: bold;
        font-size: 16px;
      }
      .price {
        color: #0f766e;
        font-weight: bold;
        margin: 8px 0;
      }
      .detail {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
        min-height: 38px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .actions button {
        padding: 8px 11px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #fff;
        cursor: pointer;
      }
      .actions button:first-child {
        background: #172554;
        color: #fff;
        border-color: #172554;
      }
      .empty {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 50px;
        text-align: center;
        color: #64748b;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #172033;
        color: #fff;
        padding: 10px 14px;
        border-radius: 7px;
        font-size: 13px;
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <h2>My Wishlist</h2>
        <div class="sub">Save products you want to check later.</div>
      </div>
      <div id="list" class="grid"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="navbar.js"></script>
    <script src="product_images.js"></script>
    <script src="wishlist.js"></script>
    <script>
      const { token, username, role } = window.shopNestAuth || {};
      if (!token || role !== 'customer') location.href = 'login.html';
      const ref = document.getElementById('list');
      function toast(t) {
        const x = document.getElementById('toast');
        x.textContent = t;
        x.style.display = 'block';
        setTimeout(() => (x.style.display = 'none'), 1400);
      }
      function render() {
        const list = getWishlist();
        if (!list.length) {
          ref.innerHTML =
            '<div class="empty">Your wishlist is empty.<br><br><a href="view_product.html">Browse products</a></div>';
          return;
        }
        ref.innerHTML = list
          .map(
            (p) =>
              `<div class="card"><img class="image" src="${getProductImage(p)}" alt="${p.name}"><div class="body"><div class="name">${p.name}</div><div class="price">₹${Number(p.price).toFixed(0)}</div><div class="detail">${p.detail}</div><div class="actions"><button onclick="addCart(${p.pid})">Add to Cart</button><button onclick="removeWish(${p.pid})">Remove</button></div></div></div>`
          )
          .join('');
      }
      async function addCart(pid) {
        const r = await fetch('http://localhost:3000/cart/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, pid, quantity: 1 }),
        });
        const d = await r.json();
        toast(d.error ? d.message : 'Added to cart');
      }
      function removeWish(pid) {
        const p = getWishlist().find((x) => Number(x.pid) === Number(pid));
        if (p) toggleWishlist(p);
        render();
        toast('Removed from wishlist');
      }
      render();
    </script>
  </body>
</html>
