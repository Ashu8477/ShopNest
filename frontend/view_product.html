<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ShopNest - Products</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        max-width: 1120px;
        margin: 32px auto;
        padding: 0 20px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
      }
      .top h2 {
        font-size: 25px;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
        margin-top: 5px;
      }
      .add {
        background: #f59e0b;
        color: #172033;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: bold;
      }
      .tools {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tools input,
      .tools select,
      .clear-filter {
        padding: 10px 12px;
        border: 1px solid #dbe3ee;
        border-radius: 7px;
        background: white;
        font-size: 14px;
      }
      .tools input {
        flex: 1;
      }
      .clear-filter {
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 7px;
        cursor: pointer;
        color: #475569;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 20px;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        transition: 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      .image {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
      }
      .body {
        padding: 16px;
      }
      .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .name {
        font-size: 17px;
        font-weight: bold;
      }
      .badge {
        font-size: 11px;
        padding: 4px 7px;
        border-radius: 12px;
        background: #ecfdf5;
        color: #047857;
      }
      .category {
        font-size: 12px;
        color: #64748b;
        margin: 7px 0;
      }
      .price {
        color: #0f766e;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .detail {
        color: #64748b;
        font-size: 13px;
        line-height: 1.55;
        min-height: 40px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .actions button {
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        background: white;
        color: #172033;
        border-radius: 6px;
        cursor: pointer;
      }
      .actions button:first-child {
        background: #172554;
        border-color: #172554;
        color: white;
      }
      .wish {
        min-width: 38px;
        padding: 8px 10px !important;
      }
      .wish.active {
        background: #fff7ed !important;
        border-color: #f59e0b !important;
        color: #b45309 !important;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        color: #64748b;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 45px;
      }
      .result-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: -8px 0 16px;
        color: #64748b;
        font-size: 12px;
      }
      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 24px 0;
      }
      .pager button {
        padding: 8px 13px;
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      .pager button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .page-number {
        font-size: 13px;
        color: #475569;
      }
      .quick-modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }
      .quick-box {
        background: white;
        max-width: 760px;
        width: 100%;
        border-radius: 14px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: relative;
      }
      .quick-box img {
        width: 100%;
        height: 100%;
        min-height: 330px;
        object-fit: cover;
      }
      .quick-info {
        padding: 28px;
      }
      .quick-info h2 {
        margin-bottom: 10px;
      }
      .quick-info .quick-price {
        font-size: 23px;
        font-weight: bold;
        color: #0f766e;
        margin: 12px 0;
      }
      .close {
        position: absolute;
        right: 12px;
        top: 10px;
        border: 0;
        background: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
      }
      .rating {
        font-size: 12px;
        color: #b45309;
        margin: 7px 0;
      }
      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: #172033;
        color: white;
        padding: 11px 15px;
        border-radius: 7px;
        font-size: 13px;
        display: none;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }
      @media (max-width: 700px) {
        .quick-box {
          grid-template-columns: 1fr;
        }
        .quick-box img {
          height: 220px;
          min-height: 0;
        }
      }
      @media (max-width: 600px) {
        .top {
          align-items: flex-start;
          gap: 12px;
        }
        .tools {
          flex-direction: column;
        }
        .add {
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h2>Products</h2>
          <div class="sub">Browse products available on ShopNest</div>
        </div>
        <a id="addProduct" class="add" href="add_product.html">+ Add Product</a>
      </div>
      <div class="tools">
        <input id="search" placeholder="Search products..." />
        <select id="sort">
          <option value="default">Sort by</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="name">Name: A to Z</option>
          <option value="newest">Newest First</option></select
        ><button id="clearFilters" class="clear-filter">Clear</button>
      </div>

      <div class="result-bar">
        <span id="resultCount">0 products</span><span id="pageInfo"></span>
      </div>
      <div id="products" class="grid"></div>
      <div class="pager">
        <button id="prevPage">← Previous</button
        ><span id="pageNumber" class="page-number">Page 1</span
        ><button id="nextPage">Next →</button>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="navbar.js"></script>
    <script src="product_images.js"></script>

    <script>
      function openDetails(pid) {
        location.href = `product_details.html?pid=${pid}`;
      }
      const productsRef = document.getElementById('products'),
        addProductRef = document.getElementById('addProduct'),
        searchRef = document.getElementById('search'),
        sortRef = document.getElementById('sort');
      const resultCountRef = document.getElementById('resultCount'),
        pageNumberRef = document.getElementById('pageNumber'),
        pageInfoRef = document.getElementById('pageInfo'),
        prevPage = document.getElementById('prevPage'),
        nextPage = document.getElementById('nextPage');
      const { token, username, role } = window.shopNestAuth || {
        token: null,
        username: null,
        role: null,
      };
      let allProducts = [];
      let currentPage = 1;
      const pageSize = 8;

      if (!token) location.href = 'login.html';
      if (role !== 'vendor') addProductRef.style.display = 'none';
      function categoryOf(p) {
        const n = (p.name || '').toLowerCase();
        if (/lamp|stand|backpack/.test(n)) return 'home';
        if (
          /mouse|keyboard|hub|webcam|headphones|speaker|watch|power bank/.test(
            n
          )
        )
          return 'electronics';
        return 'accessories';
      }
      function showToast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.style.display = 'block';
        setTimeout(() => (t.style.display = 'none'), 1600);
      }
      function render() {
        let list = [...allProducts],
          q = searchRef.value.trim().toLowerCase();

        if (q)
          list = list.filter((p) =>
            `${p.name} ${p.detail}`.toLowerCase().includes(q)
          );
        if (sortRef.value === 'low')
          list.sort((a, b) => Number(a.price) - Number(b.price));
        if (sortRef.value === 'high')
          list.sort((a, b) => Number(b.price) - Number(a.price));
        if (sortRef.value === 'name')
          list.sort((a, b) => String(a.name).localeCompare(String(b.name)));
        if (sortRef.value === 'newest')
          list.sort((a, b) => Number(b.pid) - Number(a.pid));
        const total = list.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const visible = list.slice(start, start + pageSize);
        resultCountRef.textContent = `${total} product${total === 1 ? '' : 's'}`;
        pageInfoRef.textContent = total
          ? `Showing ${start + 1}-${Math.min(start + pageSize, total)}`
          : '';
        pageNumberRef.textContent = `Page ${currentPage} of ${totalPages}`;
        prevPage.disabled = currentPage === 1;
        nextPage.disabled = currentPage === totalPages;
        productsRef.innerHTML = '';
        if (!visible.length) {
          productsRef.innerHTML = '<div class="empty">No products found</div>';
          return;
        }
        visible.forEach((p) => {
          const actions =
            role === 'vendor'
              ? `<div class="actions"><button onclick="openQuick(${p.pid})">Quick View</button><button onclick="editProduct(${p.pid})">Edit</button><button onclick="deleteProduct(${p.pid})">Delete</button></div>`
              : `<div class="actions"><button onclick="openDetails(${p.pid})">View Details</button><button onclick="addToCart(${p.pid})">Add to Cart</button></div>`;
          productsRef.innerHTML += `<div class="card"><img class="image" src="${getProductImage(p)}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=700&q=80'"><div class="body"><div class="line"><div class="name">${p.name}</div><span class="badge">In stock</span></div>

          <div class="price">₹${Number(p.price).toFixed(0)}</div><div class="detail">${p.detail}</div>${actions}</div></div>`;
        });
      }
      async function getProducts() {
        try {
          const r = await fetch('http://localhost:3000/product/view');
          const d = await r.json();
          allProducts = d.data || [];

          render();
        } catch (e) {
          productsRef.innerHTML =
            '<div class="empty">Unable to load products</div>';
        }
      }
      async function addToCart(pid) {
        try {
          const r = await fetch('http://localhost:3000/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, pid, quantity: 1 }),
          });
          const d = await r.json();
          if (!d.error) {
            showToast('Product added to cart');
            const c = document.getElementById('cartCount');
            if (c) c.textContent = Number(c.textContent || 0) + 1;
          } else showToast(d.message);
        } catch (e) {
          showToast('Unable to add product');
        }
      }
      async function deleteProduct(pid) {
        if (!confirm('Delete this product?')) return;
        try {
          const r = await fetch(`http://localhost:3000/product/remove/${pid}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ owner: username }),
          });
          const d = await r.json();
          if (!d.error) {
            showToast('Product deleted');
            getProducts();
          } else showToast(d.message);
        } catch (e) {
          showToast('Unable to delete product');
        }
      }
      function editProduct(pid) {
        location.href = `edit_product.html?pid=${pid}`;
      }
      document.getElementById('clearFilters').addEventListener('click', () => {
        searchRef.value = '';
        sortRef.value = 'default';
        currentPage = 1;
        render();
      });
      searchRef.addEventListener('input', () => {
        currentPage = 1;
        render();
      });
      // categoryRef.addEventListener('change', () => {
      //   currentPage = 1;
      //   render();
      // });
      sortRef.addEventListener('change', () => {
        currentPage = 1;
        render();
      });
      prevPage.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      nextPage.addEventListener('click', () => {
        currentPage++;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      getProducts();
    </script>
  </body>
</html>
