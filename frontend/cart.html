<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ShopNest - Cart</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        max-width: 1000px;
        margin: 32px auto;
        padding: 0 20px;
      }
      h2 {
        font-size: 25px;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
        margin: 5px 0 22px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 20px;
      }
      .item {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 12px;
      }
      .image {
        width: 90px;
        height: 75px;
        object-fit: cover;
        border-radius: 7px;
      }
      .info {
        flex: 1;
      }
      .name {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .price {
        color: #0f766e;
        font-weight: bold;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
      }
      .qty button {
        width: 28px;
        height: 28px;
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 5px;
        cursor: pointer;
      }
      .remove {
        border: 0;
        background: none;
        color: #dc2626;
        cursor: pointer;
        margin-left: 7px;
      }
      .item-total {
        font-weight: bold;
      }
      .summary {
        background: #172554;
        color: #fff;
        border-radius: 11px;
        padding: 20px;
        height: max-content;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .grand {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 14px;
        margin-top: 8px;
        font-size: 18px;
        font-weight: bold;
      }
      .clear-btn {
        width: 100%;
        padding: 9px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 7px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        margin-top: 8px;
      }
      .order-btn {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 7px;
        background: #f59e0b;
        color: #172033;
        font-weight: bold;
        cursor: pointer;
        margin-top: 17px;
      }
      .empty {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        text-align: center;
        padding: 45px;
        color: #64748b;
      }
      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: #172033;
        color: white;
        padding: 11px 15px;
        border-radius: 7px;
        display: none;
        font-size: 13px;
      }
      @media (max-width: 750px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .summary {
          order: -1;
        }
        .item {
          align-items: flex-start;
        }
        .item-total {
          margin-left: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Shopping Cart</h2>
      <div class="sub">
        Review your selected products before placing the order.
      </div>
      <div class="layout">
        <div>
          <div
            id="deliveryNote"
            style="font-size: 12px; color: #64748b; margin: 0 0 14px"
          ></div>
          <div id="cart"></div>
        </div>
        <div id="summary" class="summary" style="display: none">
          <div class="row">
            <span>Subtotal</span><span id="subtotal">₹0</span>
          </div>
          <div class="row">
            <span>Delivery</span><span id="delivery">₹0</span>
          </div>
          <div class="row grand">
            <span>Total</span><span id="total">₹0</span>
          </div>
          <button class="order-btn" onclick="placeOrder()">Place Order</button
          ><button class="clear-btn" onclick="clearCart()">Clear Cart</button>
        </div>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="navbar.js"></script>
    <script src="product_images.js"></script>
    <script>
      const cartRef = document.getElementById('cart'),
        summaryRef = document.getElementById('summary'),
        subtotalRef = document.getElementById('subtotal'),
        deliveryRef = document.getElementById('delivery'),
        totalRef = document.getElementById('total');
      const { token, username, role } = window.shopNestAuth || {
        token: null,
        username: null,
        role: null,
      };
      if (!token || role !== 'customer') location.href = 'login.html';
      let items = [];
      function toast(t) {
        const x = document.getElementById('toast');
        x.textContent = t;
        x.style.display = 'block';
        setTimeout(() => (x.style.display = 'none'), 1500);
      }
      function render() {
        document.getElementById('deliveryNote').textContent = items.length
          ? 'Free delivery on orders above ₹999'
          : '';
        cartRef.innerHTML = '';
        if (!items.length) {
          cartRef.innerHTML =
            '<div class="empty">Your cart is empty.<br><br><a href="view_product.html">Continue shopping</a></div>';
          summaryRef.style.display = 'none';
          return;
        }
        let subtotal = 0;
        items.forEach((i) => {
          const amount = Number(i.price) * Number(i.quantity);
          subtotal += amount;
          cartRef.innerHTML += `<div class="item"><img class="image" src="${getProductImage(i)}" onerror="this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=700&q=80'"><div class="info"><div class="name">${i.name}</div><div class="price">₹${Number(i.price).toFixed(2)}</div><div class="qty"><button onclick="changeQty(${i.cid},${Number(i.quantity) - 1})">−</button><span>${i.quantity}</span><button onclick="changeQty(${i.cid},${Number(i.quantity) + 1})">+</button><button class="remove" onclick="removeItem(${i.cid})">Remove</button></div></div><div class="item-total">₹${amount.toFixed(2)}</div></div>`;
        });
        const delivery = subtotal >= 999 ? 0 : 49;
        subtotalRef.textContent = `₹${subtotal.toFixed(2)}`;
        deliveryRef.textContent = delivery ? '₹49' : 'Free';
        totalRef.textContent = `₹${(subtotal + delivery).toFixed(2)}`;
        summaryRef.style.display = 'block';
      }
      async function getCart() {
        try {
          const r = await fetch(
            `http://localhost:3000/cart/view?username=${encodeURIComponent(username)}`
          );
          const d = await r.json();
          items = d.data || [];
          render();
        } catch (e) {
          cartRef.innerHTML = '<div class="empty">Unable to load cart</div>';
        }
      }
      async function changeQty(cid, quantity) {
        if (quantity < 1) {
          removeItem(cid);
          return;
        }
        await fetch(`http://localhost:3000/cart/update/${cid}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quantity }),
        });
        getCart();
      }
      async function removeItem(cid) {
        await fetch(`http://localhost:3000/cart/remove/${cid}`, {
          method: 'DELETE',
        });
        toast('Item removed');
        getCart();
      }
      async function clearCart() {
        if (!items.length) return;
        if (!confirm('Remove all items from your cart?')) return;
        try {
          await Promise.all(
            items.map((i) =>
              fetch(`http://localhost:3000/cart/remove/${i.cid}`, {
                method: 'DELETE',
              })
            )
          );
          toast('Cart cleared');
          getCart();
        } catch (e) {
          toast('Unable to clear cart');
        }
      }
      async function placeOrder() {
        if (!items.length) return;
        if (!confirm('Place this order now?')) return;
        try {
          const r = await fetch('http://localhost:3000/order/place', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username }),
          });
          const d = await r.json();
          if (!d.error) {
            toast('Order placed successfully');
            setTimeout(() => (location.href = 'my_orders.html'), 700);
          } else toast(d.message);
        } catch (e) {
          toast('Unable to place order');
        }
      }
      getCart();
    </script>
  </body>
</html>
