<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ShopNest - My Products</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        max-width: 1120px;
        margin: 32px auto;
        padding: 0 20px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .top h2 {
        font-size: 25px;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
        margin-top: 5px;
      }
      .add {
        background: #f59e0b;
        color: #172033;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: bold;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }
      .stat {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 15px;
      }
      .stat small {
        display: block;
        color: #64748b;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .stat strong {
        font-size: 23px;
        color: #172554;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        transition: 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      .image {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
      }
      .body {
        padding: 16px;
      }
      .name {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 7px;
      }
      .price {
        color: #0f766e;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .detail {
        color: #64748b;
        font-size: 13px;
        line-height: 1.55;
        min-height: 40px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .actions button {
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      .actions button:first-child {
        background: #172554;
        color: #fff;
        border-color: #172554;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 45px;
        color: #64748b;
      }
      @media (max-width: 650px) {
        .top {
          align-items: flex-start;
          gap: 12px;
        }
        .stats {
          grid-template-columns: 1fr;
        }
        .add {
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h2>My Products</h2>
          <div class="sub">Manage products from your vendor account</div>
        </div>
        <a class="add" href="add_product.html">+ Add Product</a>
      </div>
      <div class="stats">
        <div class="stat">
          <small>Active Products</small><strong id="productCount">0</strong>
        </div>
        <div class="stat">
          <small>Customer Orders</small><strong id="orderCount">0</strong>
        </div>
        <div class="stat">
          <small>Delivered Orders</small><strong id="deliveredCount">0</strong>
        </div>
        <div class="stat">
          <small>Order Value</small><strong id="orderValue">₹0</strong>
        </div>
      </div>
      <div id="products" class="grid"></div>
    </main>
    <script src="navbar.js"></script>
    <script src="product_images.js"></script>
    <script>
      const productsRef = document.getElementById('products');
      const { token, username, role } = window.shopNestAuth || {
        token: null,
        username: null,
        role: null,
      };
      if (!token || role !== 'vendor') location.href = 'login.html';
      async function getProducts() {
        try {
          const r = await fetch(
              `http://localhost:3000/vendor/products?owner=${encodeURIComponent(username)}`
            ),
            d = await r.json();
          const list = d.data || [];
          document.getElementById('productCount').textContent = list.length;
          productsRef.innerHTML = '';
          if (!list.length) {
            productsRef.innerHTML =
              '<div class="empty">You have not added any products yet</div>';
            return;
          }
          list.forEach(
            (p) =>
              (productsRef.innerHTML += `<div class="card"><img class="image" src="${getProductImage(p)}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=700&q=80'"><div class="body"><div class="name">${p.name}</div><div class="price">₹${Number(p.price).toFixed(0)}</div><div class="detail">${p.detail}</div><div class="actions"><button onclick="editProduct(${p.pid})">Edit</button><button onclick="deleteProduct(${p.pid})">Delete</button></div></div></div>`)
          );
        } catch (e) {
          productsRef.innerHTML =
            '<div class="empty">Unable to load your products</div>';
        }
      }
      async function loadVendorStats() {
        try {
          const r = await fetch(
              `http://localhost:3000/vendor/orders?username=${encodeURIComponent(username)}`
            ),
            d = await r.json();
          const rows = d.data || [];
          const ids = [...new Set(rows.map((x) => x.oid))];
          document.getElementById('orderCount').textContent = ids.length;
          document.getElementById('deliveredCount').textContent = [
            ...new Set(
              rows.filter((x) => x.status === 'Delivered').map((x) => x.oid)
            ),
          ].length;
          const totals = {};
          rows.forEach((x) => (totals[x.oid] = Number(x.total) || 0));
          document.getElementById('orderValue').textContent =
            '₹' +
            Object.values(totals)
              .reduce((a, b) => a + b, 0)
              .toFixed(0);
        } catch (e) {}
      }
      function editProduct(pid) {
        location.href = `edit_product.html?pid=${pid}`;
      }
      async function deleteProduct(pid) {
        if (!confirm('Delete this product?')) return;
        try {
          const r = await fetch(`http://localhost:3000/product/remove/${pid}`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ owner: username }),
            }),
            d = await r.json();
          if (!d.error) {
            getProducts();
            loadVendorStats();
          } else alert(d.message);
        } catch (e) {
          alert('Unable to delete product');
        }
      }
      getProducts();
      loadVendorStats();
    </script>
  </body>
</html>
