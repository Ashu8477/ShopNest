<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNest - Add Product</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        width: 460px;
        max-width: calc(100% - 30px);
        margin: 34px auto;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
      }
      h2 {
        font-size: 24px;
        margin-bottom: 6px;
      }
      .intro {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 23px;
      }
      .field {
        margin-bottom: 17px;
      }
      label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
      }
      input,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        font-family: Arial;
      }
      textarea {
        height: 95px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        border-color: #334155;
      }
      button {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 7px;
        background: #172554;
        color: white;
        cursor: pointer;
        font-size: 15px;
      }
      button:hover {
        background: #243b78;
      }
      .message {
        text-align: center;
        margin-top: 14px;
        font-size: 14px;
      }
      .preview {
        display: none;
        width: 100%;
        height: 170px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 10px;
        border: 1px solid #e2e8f0;
      }
      .hint {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Add Product</h2>
      <div class="intro">Add a product to your ShopNest store.</div>
      <form id="productForm">
        <div class="field">
          <label for="name">Product Name</label
          ><input
            type="text"
            id="name"
            placeholder="e.g. Wireless Headphones"
            required
          />
        </div>
        <div class="field">
          <label for="price">Price</label
          ><input
            type="number"
            id="price"
            placeholder="Enter price"
            min="1"
            required
          />
        </div>
        <div class="field">
          <label for="detail">Description</label
          ><textarea
            id="detail"
            placeholder="Short product description"
            required
          ></textarea>
        </div>
        <div class="field">
          <label for="image">Product Image URL</label>
          <input type="url" id="image" placeholder="https://..." />
          <div class="hint">
            Optional. Add an image link to show it on product cards.
          </div>
          <img id="preview" class="preview" alt="Product preview" />
        </div>
        <button type="submit">Add Product</button>
        <div id="message" class="message"></div>
      </form>
    </main>
    <script src="navbar.js"></script>
    <script>
      const { token, username, role } = window.shopNestAuth || {
        token: null,
        username: null,
        role: null,
      };
      if (!token || role !== 'vendor') window.location.href = 'login.html';

      const form = document.getElementById('productForm');
      const message = document.getElementById('message');
      const image = document.getElementById('image');
      const preview = document.getElementById('preview');

      image.addEventListener('input', () => {
        if (image.value.trim()) {
          preview.src = image.value.trim();
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const response = await fetch('http://localhost:3000/product/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: document.getElementById('name').value.trim(),
              price: document.getElementById('price').value,
              detail: document.getElementById('detail').value.trim(),
              image: image.value.trim(),
              owner: username,
            }),
          });
          const result = await response.json();
          if (!result.error) {
            message.textContent = 'Product added successfully';
            message.style.color = '#15803d';
            form.reset();
            preview.style.display = 'none';
            setTimeout(
              () => (window.location.href = 'vendor_products.html'),
              700
            );
          } else {
            message.textContent = result.message;
            message.style.color = '#dc2626';
          }
        } catch (error) {
          message.textContent = 'Unable to connect to server';
          message.style.color = '#dc2626';
        }
      });
    </script>
  </body>
</html>
